[package]
name = "rtango"
version = "0.1.0"
edition = "2024"
description = "Package manager for agent skills and configuration files"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
